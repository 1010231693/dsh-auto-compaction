# dsh-auto-compaction bundle patch.
# Mounts the settings-card node half at profile level so its client bundle is
# loaded. The row name MUST equal the package name (same convention as
# dsh-rewind-plugin): the client-modules node half resolves
# `<row-name>/package.json` to find the browser bundle.
# The node half registers NO service, so it can never collide with the engine's
# `ctx.compaction` provider.
- insert:
    - id: dsh-auto-compaction
      name: dsh-auto-compaction
